[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "london-commute-agent"
version = "0.1.0"
description = "A personal TfL commute disruption monitor and agent"
readme = "START_HERE.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]
